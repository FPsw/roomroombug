[project]
name = "rrb"
version = "0.1.0"
description = "roomroombug 데이터 수집·계산 워커"
readme = "README.md"
authors = [
    { name = "Seung woo baek", email = "bsw012427@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rrb = "rrb.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그 패턴, UP: 최신 문법, SIM: 단순화
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
